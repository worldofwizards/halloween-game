<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萬聖盲盒：命定試煉</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0c20; color: #fff; text-align: center; padding: 24px 16px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 22px; color: #fb923c; margin-bottom: 8px; }
    p.sub { font-size: 14px; color: #cbd5e1; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 400px; margin: 0 auto; width: 100%; }
    .door-btn { background: #1e1b4b; border: 2px solid #a855f7; border-radius: 12px; color: #fff; padding: 28px 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .door-btn:active { transform: scale(0.96); }
    .card { background: #1e1b4b; border: 2px solid #ec4899; border-radius: 16px; padding: 24px 16px; max-width: 400px; margin: 0 auto; width: 100%; display: none; }
    .prize-title { font-size: 18px; font-weight: bold; color: #38bdf8; margin: 20px 0; line-height: 1.4; word-break: break-all; }
    .redeem-btn { background: #e11d48; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; padding: 14px; width: 100%; cursor: pointer; }
    .redeem-btn.done { background: #475569 !important; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>🎃 萬聖盲盒：命定試煉 🎃</h1>
  <p class="sub" id="statusText">憑直覺點選一扇維度之門揭開獎項：</p>

  <div class="grid" id="doorsArea">
    <button class="door-btn" onclick="makeChoice('門1')">🚪 門 1</button>
    <button class="door-btn" onclick="makeChoice('門2')">🚪 門 2</button>
    <button class="door-btn" onclick="makeChoice('門3')">🚪 門 3</button>
    <button class="door-btn" onclick="makeChoice('門4')">🚪 門 4</button>
  </div>

  <div class="card" id="resultCard">
    <p style="color: #cbd5e1; font-size: 14px;">🎁 你的命定試煉獎項</p>
    <div class="prize-title" id="prizeDisplay"></div>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">結帳時請主動出示此畫面供現場人員核銷折抵</p>
    <button class="redeem-btn" id="redeemBtn" onclick="confirmRedeem()">【限店員點擊】確認核銷</button>
  </div>

  <script>
    const LIFF_ID = "2011714379-OyJKvZ9Q";
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzldKIAPJAwkJ14EVFgOKAiMT_iaDqIV2ufazDpKGfA32saM9W3d84Wl45RU7bQX_5r/exec";

    const PRIZE_LIST = {
      "門1": "門1【鏡像之門】：神諭籤詩+商品折價卷95折",
      "門2": "門2【錯視之門】：神諭籤詩+桿道夫第二人8折",
      "門3": "門3【無限之門】：神諭籤詩+品牌商品100元任選",
      "門4": "門4【顛倒之門】：神諭籤詩+幻覺帽踢"
    };

    let userKey = "guest_" + Math.random().toString(36).substring(2, 8);

    // 啟動頁面
    window.addEventListener("DOMContentLoaded", () => {
      // 嘗試初始化 LIFF
      if (typeof liff !== "undefined") {
        liff.init({ liffId: LIFF_ID }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(p => {
              userKey = p.userId;
              checkHistory();
            }).catch(() => checkHistory());
          } else {
            checkHistory();
          }
        }).catch(() => checkHistory());
      } else {
        checkHistory();
      }
    });

    function checkHistory() {
      const savedPrize = localStorage.getItem("prize_" + userKey);
      const isUsed = localStorage.getItem("used_" + userKey);
      if (savedPrize) {
        showUI(savedPrize, isUsed === "true");
      }
    }

    function makeChoice(door) {
      const prize = PRIZE_LIST[door] || PRIZE_LIST["門1"];
      
      // 立即記錄在本地防重複
      localStorage.setItem("prize_" + userKey, prize);
      localStorage.setItem("used_" + userKey, "false");

      // 立即顯示畫面，不延遲
      showUI(prize, false);

      // 非同步回傳後台試算表
      try {
        fetch(BACKEND_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "draw", userId: userKey, choice: door, prize: prize })
        });
      } catch (e) {}
    }

    function showUI(prize, isRedeemed) {
      document.getElementById("doorsArea").style.display = "none";
      document.getElementById("statusText").style.display = "none";
      document.getElementById("resultCard").style.display = "block";
      document.getElementById("prizeDisplay").innerText = prize;

      if (isRedeemed) {
        const btn = document.getElementById("redeemBtn");
        btn.innerText = "已於門市核銷完畢";
        btn.classList.add("done");
        btn.disabled = true;
      }
    }

    function confirmRedeem() {
      const pass = confirm("【現場店員專用】確定要核銷並折抵此獎項嗎？確認後無法復原。");
      if (!pass) return;

      localStorage.setItem("used_" + userKey, "true");
      showUI(document.getElementById("prizeDisplay").innerText, true);

      // 非同步發送核銷
      try {
        fetch(BACKEND_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "redeem", userId: userKey })
        });
      } catch (e) {}
    }
  </script>
</body>
</html>
