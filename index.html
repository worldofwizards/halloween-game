<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>萬聖盲盒：命定試煉 - 桿道夫</title>
  <meta property="og:title" content="萬聖盲盒：命定試煉 - 桿道夫">
  <meta property="og:description" content="載入試煉儀式中... 【巫師試煉：4 瓶命定魔藥】 直覺就是你的魔法，挑一瓶魔藥調配出你的命定力量與盲盒獎項！">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #12091f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    .header-area {
      text-align: center;
      margin-bottom: 20px;
      max-width: 400px;
    }
    h1 {
      font-size: 21px;
      color: #c084fc;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    p.sub {
      font-size: 13px;
      color: #d8b4fe;
      line-height: 1.5;
    }
    .potions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }
    .potion-card {
      background: #1f1133;
      border: 2px solid #581c87;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      transition: transform 0.15s ease, border-color 0.2s;
    }
    .potion-card:active {
      transform: scale(0.96);
      border-color: #c084fc;
    }
    .potion-card img {
      width: 100%;
      height: auto;
      display: block;
      min-height: 140px;
      background: #2b1348;
    }
    #result-view {
      display: none;
      width: 100%;
      max-width: 380px;
      background: #1f1133;
      border-radius: 16px;
      border: 1px solid #c084fc;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(192, 132, 252, 0.25);
    }
    .chosen-preview {
      width: 140px;
      margin: 0 auto 16px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #7e22ce;
    }
    .chosen-preview img {
      width: 100%;
      display: block;
    }
    .prize-title {
      font-size: 13px;
      color: #c084fc;
      margin-bottom: 6px;
    }
    .prize-name {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .badge-available { background: #15803d; color: #fff; }
    .badge-redeemed { background: #b91c1c; color: #fff; }
    .staff-box {
      border-top: 1px dashed #6b21a8;
      margin-top: 16px;
      padding-top: 16px;
    }
    .rule-note {
      font-size: 12px;
      color: #d8b4fe;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    button.staff-btn {
      background: #9333ea;
      color: #ffffff;
      border: none;
      padding: 13px 0;
      font-size: 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 10px rgba(147, 51, 234, 0.3);
    }
    button.staff-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    #loading, #login-block {
      margin-top: 80px;
      font-size: 15px;
      color: #d8b4fe;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
    }
    .login-btn {
      margin-top: 18px;
      background: #06c755;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 載入中畫面 -->
  <div id="loading">載入試煉儀式中...</div>

  <!-- 未登入阻擋畫面（使用者按上一頁或沒登入時強制停在此處） -->
  <div id="login-block" style="display: none;">
    <p>⚠️ 本試煉必須驗證 LINE 身分<br>請點擊下方按鈕登入 LINE 帳號後再進行抽獎！</p>
    <button class="login-btn" onclick="liff.login()">登入 LINE 帳號</button>
  </div>

  <!-- 選魔藥畫面 -->
  <div id="game-view" style="display: none;">
    <div class="header-area">
      <h1>【巫師試煉：4 瓶命定魔藥】</h1>
      <p class="sub">直覺就是你的魔法，挑一瓶魔藥<br>調配出你的命定力量與盲盒獎項！</p>
    </div>

    <div class="potions-grid">
      <div class="potion-card" onclick="openPotion('覺醒藥水', 'potion--01.png')">
        <img src="potion--01.png" alt="覺醒藥水">
      </div>
      <div class="potion-card" onclick="openPotion('預言藥水', 'potion--02.png')">
        <img src="potion--02.png" alt="預言藥水">
      </div>
      <div class="potion-card" onclick="openPotion('深淵藥水', 'potion--03.png')">
        <img src="potion--03.png" alt="深淵藥水">
      </div>
      <div class="potion-card" onclick="openPotion('封印藥水', 'potion--04.png')">
        <img src="potion--04.png" alt="封印藥水">
      </div>
    </div>
  </div>

  <!-- 開獎/核銷結果畫面 -->
  <div id="result-view">
    <div id="badge" class="status-badge badge-available">● 優惠券可使用</div>
    <div class="chosen-preview">
      <img id="result-img" src="" alt="選擇的魔藥">
    </div>
    <div class="prize-title">恭喜調配出【<span id="potion-title"></span>】，獲得：</div>
    <div class="prize-name" id="prize-text"></div>

    <div class="staff-box">
      <p class="rule-note">點餐或結帳時請出示此畫面<br>⚠️ 請由現場店員點擊下方按鈕，自行點擊無效</p>
      <button id="redeem-btn" class="staff-btn" onclick="verifyRedemption()">店員專用核銷按鈕</button>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2011877308-n2rvfj72";
    const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbwC0IYEO_NfppcQ5c9GXay8HwcVmC7_fhZWCJWMteFk1OCQ2quR8ucMuBg2TGDscw3J0w/exec";

    const PRIZES = {
      "覺醒藥水": "橘色襪子 $299（限當天使用）",
      "預言藥水": "桿道夫第二人 8 折",
      "深淵藥水": "品牌商品折價券 8 折（限當天使用）",
      "封印藥水": "品牌商品 100 元任選（可補差價）"
    };

    let userLineId = "";
    let userDisplayName = "";
    const STORAGE_KEY = "halloween_v4_";

    async function initLIFF() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        // 核心檢查：如果沒有登入，直接擋下
        if (!liff.isLoggedIn()) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('login-block').style.display = 'block';
          // 自動發起登入；若使用者上一頁跳回，就留在 login-block
          liff.login();
          return;
        }

        // 獲取個人真實 Profile
        const profile = await liff.getProfile();
        userLineId = profile.userId;
        userDisplayName = profile.displayName || "LINE 用戶";

        if (!userLineId) {
          throw new Error("無法取得有效 LINE UserID");
        }

        // 登入驗證完全通過，關閉 loading
        document.getElementById('loading').style.display = 'none';

        // 檢查該 LINE 帳號是否已經抽過
        let existing = null;
        try {
          existing = JSON.parse(localStorage.getItem(STORAGE_KEY + userLineId));
        } catch (e) {}

        if (existing && existing.potion) {
          showResult(existing.potion, existing.prize, existing.image, existing.redeemed);
        } else {
          document.getElementById('game-view').style.display = 'block';
        }

      } catch (err) {
        console.error("LIFF 驗證未通過：", err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('login-block').style.display = 'block';
      }
    }

    function openPotion(potionName, potionImg) {
      // 二次驗證防繞過：如果沒有取到 LINE ID，絕對不准抽
      if (!userLineId) {
        alert("尚未取得 LINE 身份，請先登入！");
        liff.login();
        return;
      }

      const prize = PRIZES[potionName] || "神秘獎勵";
      const record = {
        potion: potionName,
        prize: prize,
        image: potionImg,
        redeemed: false,
        timestamp: new Date().toISOString()
      };

      try {
        localStorage.setItem(STORAGE_KEY + userLineId, JSON.stringify(record));
      } catch (e) {}

      showResult(potionName, prize, potionImg, false);

      fetch(GOOGLE_SHEET_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "draw",
          userId: userLineId,
          userName: userDisplayName,
          potion: potionName,
          prize: prize
        })
      }).catch(err => console.error("Sheet 記錄失敗:", err));
    }

    function showResult(potionName, prize, potionImg, isRedeemed) {
      document.getElementById('game-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      document.getElementById('potion-title').innerText = potionName;
      document.getElementById('prize-text').innerText = prize;
      document.getElementById('result-img').src = potionImg;

      const badge = document.getElementById('badge');
      const btn = document.getElementById('redeem-btn');

      if (isRedeemed) {
        badge.className = "status-badge badge-redeemed";
        badge.innerText = "✖ 已核銷完畢";
        btn.disabled = true;
        btn.innerText = "已由櫃檯完成折抵";
      } else {
        badge.className = "status-badge badge-available";
        badge.innerText = "● 優惠券可使用";
        btn.disabled = false;
        btn.innerText = "店員專用核銷按鈕";
      }
    }

    function verifyRedemption() {
      if (!userLineId) {
        alert("無效的操作身份！");
        return;
      }

      if (confirm("【店員核銷確認】\n確認已折抵此優惠？\n按下確認後將立即作廢失效！")) {
        let record = null;
        try {
          record = JSON.parse(localStorage.getItem(STORAGE_KEY + userLineId));
        } catch (e) {}

        if (record) {
          record.redeemed = true;
          try {
            localStorage.setItem(STORAGE_KEY + userLineId, JSON.stringify(record));
          } catch (e) {}
          showResult(record.potion, record.prize, record.image, true);
        }

        fetch(GOOGLE_SHEET_API, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "redeem",
            userId: userLineId
          })
        }).catch(err => console.error(err));
      }
    }

    window.addEventListener('load', initLIFF);
  </script>
</body>
</html>
